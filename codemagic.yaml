workflows:
  verify-ios:
    name: ShiftEarnings — Xcode verify
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Show Xcode version
        script: |
          xcodebuild -version

      - name: Run all tests
        script: |
          set -o pipefail
          xcodebuild test             -project "$CM_BUILD_DIR/ShiftEarnings.xcodeproj"             -scheme "ShiftEarnings"             -destination 'platform=iOS Simulator,name=iPhone 16'             CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned iPhone app
        script: |
          set -o pipefail
          xcodebuild build             -project "$CM_BUILD_DIR/ShiftEarnings.xcodeproj"             -scheme "ShiftEarnings"             -configuration Debug             -destination 'generic/platform=iOS'             CODE_SIGNING_ALLOWED=NO

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Test/**
      - /tmp/xcodebuild_logs/*.log
